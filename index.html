<script>
/* ---------- Prepared content (all illustrative, written in advance) ---------- */
const PLATFORMS = [
  {id:'ChatGPT', label:'Open ChatGPT', url:'https://chatgpt.com/'},
  {id:'Claude', label:'Open Claude', url:'https://claude.ai/'},
  {id:'Gemini', label:'Open Gemini', url:'https://gemini.google.com/'},
  {id:'Microsoft Copilot', label:'Open Microsoft Copilot', url:'https://copilot.microsoft.com/'}
];
const TOOLS = ['ChatGPT','Claude','Gemini','Microsoft Copilot','Other','Prepared example'];

const SCEN = {
A: {
 name:'Inclusive community event', short:'Community event',
 initialPrompt:`Develop a welcoming community event for adults who do not know one another. Suggest a programme, resources and ways to encourage participation. Explain why your activities would help people connect.`,
 facts:['Twenty adults.','Sixty minutes.','A free community room and two volunteers.','No cooking facilities.','Food preferences and language needs have not yet been confirmed.'],
 constraints:['A total budget of $120.','Activities must allow seated participation.','Participants may have different levels of confidence speaking in a group.'],
 criteria:'A feasible agenda, estimated costs within budget, inclusive participation and explicit handling of missing information.',
 goal:'Plan a 60-minute welcoming event that helps adults who do not know one another start to connect.',
 audience:'Twenty adults who have not met before, with different levels of confidence speaking in a group.',
 output:'A timed agenda that adds up to 60 minutes, volunteer responsibilities, an itemised cost estimate with a total, and alternatives for people who are uncomfortable speaking to the whole group.',
 initialResponse:`Community Connections Morning: a programme for new acquaintances

Programme (about 90 minutes)
1. Welcome and name badges (10 min). Greet people at the door, hand out name badges and invite them to grab a drink.
2. Human bingo (15 min). Each person gets a bingo card with prompts such as "has lived overseas" or "plays an instrument" and walks around the room finding someone who matches each square. This gets people moving and talking straight away.
3. Round of introductions (15 min). Everyone shares their name and one thing they love about the area with the whole group.
4. Small-group conversation (20 min). Seat people in small groups of four or five with conversation prompt cards, so quieter people can talk without addressing the whole room.
5. Collaborative poster (20 min). Each group creates a poster called "Our ideal neighbourhood".
6. Shared morning tea and close (10 min). Serve a shared morning tea with vegetarian and gluten-free options, and invite people to sign up for a follow-up event.

Resources and estimated costs
- Snacks and drinks: $60
- Name badges and markers: $10
- Printed bingo and conversation cards: $15
- Poster and craft materials: $30
- Small prizes for bingo winners: $25
Total estimated cost: $140

Why this helps people connect
Movement-based games lower social barriers, small groups give everyone a chance to speak, and a shared creative task gives people something to talk about other than themselves. Ending with food encourages people to stay and continue conversations.`,
 initialReceived:'Only the initial prompt above. It did not receive the fact card, so it was not told the group size, the 60-minute limit, the $120 budget or the need for seated activities.',
 claims:[
  {text:'Seat people in small groups of four or five with conversation prompt cards, so quieter people can talk without addressing the whole room.', type:'Recommendation', verdict:'Supported', evidence:'The fact card says participants have different levels of confidence speaking in a group and activities must be seated. Twenty adults make four groups of five, and two volunteers can each support two tables.'},
  {text:'Serve a shared morning tea with vegetarian and gluten-free options.', type:'Recommendation', verdict:'Uncertain', evidence:'Food without cooking is feasible, but the fact card says food preferences have not been confirmed, so we cannot yet tell whether these options meet people\'s needs. The cost also needs checking against the budget.'},
  {text:'Total estimated cost: $140.', type:'Factual claim', verdict:'Unsupported', evidence:'The line items do add up to $140, but the fact card gives a total budget of $120, so the plan is $20 over budget. The AI was not given the budget, so this shows the value of supplying context.'}
 ],
 omission:'It did not say what it was assuming about numbers, timing or budget, and it did not flag unknown food preferences or language needs as things to find out. It also ran to about 90 minutes and included a standing game.',
 improvedPrompt:`Goal: Plan a 60-minute welcoming event that helps adults who do not know one another start to connect.

Audience: Twenty adults who have not met before. They have different levels of confidence speaking in a group.

Relevant facts:
- A free community room and two volunteers.
- No cooking facilities.
- Food preferences and language needs have not yet been confirmed.

Constraints:
- Total budget of $120, including everything.
- Every activity must allow seated participation.
- The event must fit in 60 minutes.

Requested output:
1. A timed agenda that adds up to exactly 60 minutes.
2. Responsibilities for each of the two volunteers.
3. An itemised cost estimate with a total, staying within $120.
4. For each activity, an alternative for people who are uncomfortable speaking to the whole group.

Success criteria: a feasible agenda, estimated costs within budget, inclusive participation and explicit handling of missing information.

Missing information and assumptions: List any needs that are still unresolved, such as food preferences or language needs, and say how the organisers could find out. Do not invent these needs. State any assumptions you make.`,
 improvedResponse:`Community connection hour (60 minutes, 20 adults, all activities seated)

Timed agenda

/* Word diff for visible revisions */
function diffHTML(a,b){const A=a.split(/(\s+)/).filter(x=>x!==''),B=b.split(/(\s+)/).filter(x=>x!=='');
 if(A.length*B.length>400000)return esc(b);
 const n=A.length,m=B.length,L=Array.from({length:n+1},()=>new Uint16Array(m+1));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
 let i=0,j=0,out='';while(i<n&&j<m){if(A[i]===B[j]){out+=esc(A[i]);i++;j++;}else if(L[i+1][j]>=L[i][j+1]){out+=/^\s+$/.test(A[i])?esc(A[i]):`<del>${esc(A[i])}</del>`;i++;}else{out+=/^\s+$/.test(B[j])?esc(B[j]):`<ins>${esc(B[j])}</ins>`;j++;}}
 while(i<n){out+=/^\s+$/.test(A[i])?'':`<del>${esc(A[i])}</del>`;i++;}while(j<m){out+=/^\s+$/.test(B[j])?esc(B[j]):`<ins>${esc(B[j])}</ins>`;j++;}return out.replace(/<\/ins>(\s+)<ins>/g,'$1').replace(/<\/del>(\s+)<del>/g,'$1');}

/* Split an AI response into meaningful sentences (ported from the activity engine) */
function splitSentences(txt){const out=[];
 txt.replace(/\r/g,'').split(/\n+/).forEach(raw=>{
  const line=raw.replace(/\*\*|__|`/g,'').replace(/^\s*(#+|[-*•·]|\d+[.)])\s+/,'').trim();if(!line)return;
  let cur='';
  for(let i=0;i<line.length;i++){const ch=line[i];cur+=ch;
   if('.!?'.includes(ch)){let j=i+1;while(j<line.length&&/["”')\]]/.test(line[j])){cur+=line[j];j++;}
    if(j<line.length&&/\s/.test(line[j])){let k=j;while(k<line.length&&/\s/.test(line[k]))k++;
     if(k<line.length&&/["“'(\[A-Z0-9$]/.test(line[k])&&!/\b(e\.g|i\.e|etc|vs|approx)\.$/i.test(cur)){out.push(cur.trim());cur='';i=k-1;continue;}}
    i=j-1;}}
  if(cur.trim())out.push(cur.trim());});
 /* drop headings and fragments: no end punctuation, no figures, few words, or ending in a colon */
 return out.filter(p=>{const w=p.split(/\s+/).length;if(p.length<8)return false;if(/:$/.test(p))return false;if(!/[.!?)"”]$/.test(p)&&!/\d/.test(p)&&w<=8)return false;return true;}).slice(0,120);}
const norm=s=>s.toLowerCase().replace(/[^a-z0-9$% ]/g,' ').replace(/\s+/g,' ').trim();
/* Findings from Verify, used to improve the prompt and to check the revised response */
const trimDot=t=>String(t||'').trim().replace(/[.\s]+$/,'');
/* first sentence of a reason, starting lower case, for use after a colon */
const brief=t=>{let x=String(t||'').trim().split(/(?<=[.!?])\s+(?=[A-Z])/)[0];x=trimDot(x);return /^[A-Z][a-z]/.test(x)?x[0].toLowerCase()+x.slice(1):x;};
function findingsOf(e){return e.units.filter(u=>u.sel&&(u.verdict==='Unsupported'||u.verdict==='Uncertain'));}
function findingsText(e){return findingsOf(e).map(u=>u.verdict==='Unsupported'
 ?`- Your previous answer said: "${trimDot(u.text)}". I judged this unsupported${has(u.reason)?': '+brief(u.reason):' against the facts'}. Correct it so it fits the facts.`
 :`- Your previous answer said: "${trimDot(u.text)}". I judged this uncertain${has(u.reason)?': '+brief(u.reason):' because the facts do not confirm it'}. Do not assume it; say what needs to be found out.`).join('\n');}
const OUTCOME={
 A:[['90 minutes','Fixed: the revised agenda adds up to exactly 60 minutes.'],['human bingo','Fixed: every activity in the revised plan is seated; the walking game has gone.'],['walks around the room','Fixed: every activity in the revised plan is seated; nobody needs to walk around the room.'],['whole group','Fixed: introductions now happen at tables, and people can pass or write their answer instead.'],['140','Fixed: the itemised costs now total $120, within the budget.'],['vegetarian','Handled: food preferences are now listed as unresolved, to be asked on the registration form before buying food.'],['prizes','Fixed: prizes are no longer in the plan, and costs stay within $120.'],['snacks and drinks','Fixed: food and drinks now cost $70 ($45 plus $25), and the total stays within $120.']],
 B:[['week 1: averages','Fixed: week 1 now starts with a fractions refresher before moving on to the mean.'],['saturday','Fixed: the revised plan has no weekend study.'],['45 minutes','Fixed: every session is now 30 minutes.'],['80%','Handled: the revised plan sets no score target without a baseline, and uses the first Friday check to get one.'],['premium subscription','Fixed: the revised plan uses free resources only.'],['every second day','Fixed: replaced by daily mixed practice sets and one timed set in week 4, each within 30 minutes.'],['video lessons','Fixed: sessions now centre on working problems and explaining answers, not watching videos.'],['study with a friend','Not addressed: the revised plan does not mention studying with a friend; it is still an optional idea.']]};

/* Divide AI feedback into separate suggestions (numbered or bulleted items, otherwise sentences) */
function extractSuggestions(t){const lines=String(t||'').replace(/\r/g,'').split('\n').map(l=>l.replace(/\*\*|__|`/g,'').trim()).filter(Boolean);const mark=/^(\d+[.)]|[-*•·])\s+/;

/* ---------- Design an assessment ---------- */
function frame(){const a=state.as;const b=v=>has(v)?esc(v):'______';return `In my subject, students could use AI to ${b(a.s1)}. They would check ${b(a.s2)} using ${b(a.s3)}. I would know they had learned because they could ${b(a.s4)}.`;}

 <div class="soft"><p style="margin:0 0 .5rem"><strong>What this strategy is.</strong> When students can use AI, an assessment that only collects the final product mostly measures the AI. This strategy redesigns the task so that students use AI openly, check what it produced, and then show their own understanding. The AI's output becomes material for the assessment, not the answer to it.</p>
 <p style="margin:0 0 .5rem"><strong>Aim:</strong> design a short assessment in which the evidence of learning is the student's judgement and explanation, using one of the strategies you have just practised.</p>
 <p style="margin:0 0 .2rem"><strong>Your task:</strong></p><ol style="margin:.1rem 0 .5rem;padding-left:1.4rem"><li><strong>Choose a starting point:</strong> one of the sector examples below, or Custom for your own subject.</li><li><strong>Complete the sentence</strong> about what students use AI for, what they check, what they check it against, and how you would know they learned.</li><li><strong>Assemble a brief</strong> with five parts: the task, the AI contribution, the student's verification, the submission evidence and an individual explanation or demonstration.</li><li><strong>Try the illustrative example</strong> on judging a model's claimed usefulness.</li></ol>

 <fieldset><legend>Start from an example (optional)</legend><div class="radios">${Object.entries(ASSESS_EX).map(([k,x])=>`<label for="asx_${k}"><input type="radio" id="asx_${k}" name="asx" value="${k}" data-asex="1" ${a.ex===k?'checked':''}>${x.label}</label>`).join('')}<label for="asx_custom"><input type="radio" id="asx_custom" name="asx" value="custom" data-asex="1" ${a.ex==='custom'?'checked':''}>Custom</label></div></fieldset>
 ${a.ex?assessSector(a.ex):''}
 <div class="panel"><h3 style="margin-top:0">Complete the sentence</h3>
 ${inp('as.s1','In my subject, students could use AI to …',{ph:'e.g., draft feedback on an essay plan'})}${inp('as.s2','They would check …',{ph:'e.g., whether each suggestion matches the marking criteria'})}${inp('as.s3','using …',{ph:'e.g., the assignment rubric'})}${inp('as.s4','I would know they had learned because they could …',{ph:'e.g., explain why they rejected one suggestion and show the change'})}
 <p class="promptbox" id="frameOut" style="margin-top:1rem">${frame()}</p></div>
 <div class="panel"><h3 style="margin-top:0">Assemble a short brief</h3>
 ${ta('as.task','The task',{cls:'short',ph:'e.g., Use AI to get feedback on a draft paragraph against the rubric.'})}${ta('as.ai','The required AI contribution',{cls:'short',ph:'e.g., Up to four suggestions, each linked to a rubric criterion.'})}${ta('as.verify',"The student's verification",{cls:'short',ph:'e.g., Accept, adapt or reject each suggestion with a reason citing the rubric.'})}${ta('as.evidence','Submission evidence',{cls:'short',ph:'e.g., The draft, the AI feedback, the decision log and the revised paragraph.'})}${ta('as.demo','Individual explanation or demonstration',{cls:'short',ph:'e.g., A two-minute in-class explanation of one rejected suggestion.'})}
 <h4 style="margin-bottom:.3rem">Your brief</h4><div class="promptbox" id="briefOut">${esc(briefText())}</div>
 <div class="row" style="margin-top:.5rem"><button type="button" class="btn" data-do="copy" data-from="briefOut">Copy brief</button></div></div>
 <div class="panel"><h3 style="margin-top:0">Illustrative example: is this model useful?</h3>
 <p class="note"><strong>Fictional teaching data.</strong></p>
 <p class="promptbox">A model predicts every order will arrive on time. Of 100 orders, eight arrive late. The model therefore achieves 92% accuracy but identifies none of the late deliveries.</p>
 ${ta('as.dataAns','A student claims this model is useful for detecting late deliveries. What evidence would you expect them to use when evaluating that claim?',{ph:'e.g., I would expect them to check how many of the late orders the model actually found…'})}
 <div class="row"><button type="button" class="btn small" data-do="showData" id="dataBtn" ${has(a.dataAns)?'':'disabled'}>Show an example answer</button></div>
 ${a.showData?`<div class="src judg"><span class="tag">Example answer</span>
 <div class="tblwrap"><table class="judge" style="max-width:32rem;margin:.4rem 0"><caption class="note" style="text-align:left">Counts implied by the description (fictional)</caption><thead><tr><th scope="col"></th><th scope="col">Predicted late</th><th scope="col">Predicted on time</th></tr></thead><tbody><tr><th scope="row">Actually late</th><td>0</td><td>8</td></tr><tr><th scope="row">Actually on time</th><td>0</td><td>92</td></tr></tbody></table></div>
 <ul><li>Late deliveries found: 0 of 8, so the model detects none of the cases it is meant to detect.</li><li>Accuracy is (0 + 92) ÷ 100 = 92%, exactly what "always predict on time" scores. Accuracy alone hides this when late orders are rare.</li><li>A useful detector would need to find a reasonable share of late orders; the student should report that share (here 0%) and compare with a simple baseline.</li><li>They should also ask what a missed late delivery costs, and whether the result holds on more than 100 orders.</li></ul>
 <p>Conclusion: the evidence does not support the claim that this model is useful for detecting late deliveries.</p></div>`:''}</div>
 ${renderTp()}
 ${nextStrat('assess')}${why('Why this matters','<p class="measure">An assessment that asks for the AI output alone rewards whoever has the best tool. Asking for verification evidence and an individual explanation makes the learner\'s judgement visible and gives you something to assess.</p>')}</div>`;}

function notesText(){const L=[];const line=(t='')=>L.push(t);const pre=(l,v)=>{if(has(v)){line(l+':');line(v.trim());line();}};

 Object.entries(TUTOR).forEach(([k,T])=>{const u=state.tu[k];if(!has(u.direct)&&!u.rounds.some(R=>has(R.me)))return;line(`== AI as a tutor: ${T.title} ==`);pre('Direct answer',u.direct);pre('My tutor prompt',u.prompt);u.rounds.forEach((R,i)=>{if(has(R.ai))pre(`Tutor ${i+1}`,R.ai);if(has(R.me))pre(`Me ${i+1}`,R.me);});TU_CMP.forEach(([c,l])=>{if(u.cmp[c].r)line(`${l} ${u.cmp[c].r}${has(u.cmp[c].why)?' ('+u.cmp[c].why.trim()+')':''}`);});pre('Reflection',u.reflection);line();});

function askConfirm(msg){return new Promise(res=>{const back=document.activeElement;

 const done=v=>{o.remove();document.removeEventListener('keydown',key,true);if(back&&back.focus)back.focus({preventScroll:true});res(v);};
 const key=e=>{if(e.key==='Escape'){e.preventDefault();done(false);}if(e.key==='Tab'){const bs=o.querySelectorAll('button');if(e.shiftKey&&document.activeElement===bs[0]){e.preventDefault();bs[1].focus();}else if(!e.shiftKey&&document.activeElement===bs[1]){e.preventDefault();bs[0].focus();}}};
 o.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(b)done(b.dataset.r==='1');});
 document.addEventListener('keydown',key,true);document.body.appendChild(o);o.querySelector('[data-r="1"]').focus();});}
/* Help (?) buttons: plain explanations with examples from the current scenario */
const HELP_TITLE={type:'Help: what kind of statement is it?',verdict:'Help: choosing a verdict',decision:'Help: accept, adapt or reject',c_acc:'Help: accuracy against the facts',c_feas:'Help: feasibility',c_rel:'Help: relevance',c_unc:'Help: handling of uncertainty',c_use:'Help: usefulness',fixed:'Help: were the problems fixed?',tadd:'Help: tutor instructions',tcmp:'Help: comparing the two approaches',trub:'Help: evaluation criteria'};
const CRIT_HELP={
 acc:{t:'Accuracy against the facts',q:'Does the response match the fact card?',d:'Check the details the response states, such as numbers, totals, times, days and rules, against the fact card. A response can sound confident and still get a fact wrong.',look:'Totals, durations, limits and anything that conflicts with a rule on the fact card.',A:{b:'The revised costs add up to $120 and the agenda to 60 minutes; the initial plan was $140 and about 90 minutes.',w:'The revised plan gets the budget right but now gives the wrong number of volunteers.'},B:{b:'The revised plan has 30-minute weekday sessions only; the initial plan had 45-minute sessions and Saturday reviews.',w:'The revised plan removes weekends but now lists a topic that is not on the test.'}},
 feas:{t:'Feasibility',q:'Could it actually be done with what is available?',d:'Think about time, money, people, space and resources. A plan can be accurate and still impossible to carry out in practice.',look:'Whether each activity fits the time, the volunteers or learner can do it, and nothing needs resources that are not available.',A:{b:'Two volunteers can run every part, nothing needs cooking, and every activity can be done seated.',w:'The revised plan needs a projector and a third helper that the event does not have.'},B:{b:'Every session fits in 30 minutes and uses free resources only.',w:'The revised plan squeezes three topics and a test into one 30-minute session.'}},
 rel:{t:'Relevance',q:'Does it address this situation, this audience and the task?',d:'A relevant response is tailored to the scenario. Generic advice that could apply to anyone, or material that answers a different question, is less relevant.',look:'Whether it speaks to the people involved and the goal, and leaves out padding.',A:{b:'The activities are designed for adults who have just met and have different confidence speaking in groups.',w:'The revised plan adds a long section on marketing the event, which was not asked for.'},B:{b:'It covers exactly the three test topics and starts with the fractions the learner finds hard.',w:'It adds advanced topics such as regression that are not on the test.'}},
 unc:{t:'Handling of uncertainty',q:'Does it say what it does not know, instead of guessing?',d:'Good responses state their assumptions, flag missing information and suggest how to find it out. Weak responses fill gaps with invented details.',look:'Lists of assumptions or unresolved needs, questions back to you, and no made-up facts.',A:{b:'It lists food preferences and language needs as unresolved and says to ask on the registration form.',w:'It now states that "most guests are vegetarian", which nobody has confirmed.'},B:{b:'It asks about the test format and sets no score targets without a baseline.',w:'It assumes the test is multiple choice without being told.'}},
 use:{t:'Usefulness',q:'Could the person act on it straight away?',d:'A useful response is clear, specific and organised, so someone could follow it without rewriting it. Length is not usefulness: a short, clear plan can beat a long one.',look:'Concrete steps, times, roles or amounts, and a layout that is easy to follow.',A:{b:'A timed agenda with volunteer roles and an itemised budget that an organiser could use tomorrow.',w:'The revised plan is accurate but is a long paragraph with no times or roles.'},B:{b:'A day-by-day weekday plan the learner could start on Monday.',w:'It explains study theory at length but never says what to do each day.'}}
};
function critHelp(k){const eg=t=>`<div class="eg">${t}</div>`;
 if(k==='fixed')return `<h3>Were the problems you found fixed?</h3><p>Go back to each sentence you marked <span class="pill Unsupported">Unsupported</span> or <span class="pill Uncertain">Uncertain</span> and find what the revised response now says about it.</p><dl>
 <dt>Fixed</dt><dd>The problem is gone and the new version fits the facts.${eg(state.scen==='A'?'<strong>Example:</strong> "Programme (about 90 minutes)" was unsupported. Fixed: the revised agenda adds up to exactly 60 minutes.':'<strong>Example:</strong> "Saturday: one-hour review" was unsupported. Fixed: the revised plan has no weekend study.')}</dd>

 return `<h3>${c.t}</h3><p><strong>${c.q}</strong> ${c.d}</p><p><strong>What to look for:</strong> ${c.look}</p>

function helpBtn(k){return `<button type="button" class="qbtn" data-do="help" data-h="${k}" aria-label="${HELP_TITLE[k]}" title="What does this mean?">?</button>`;}
function helpHTML(k){const A=state.scen==='A';const eg=t=>`<div class="eg"><strong>Example:</strong> ${t}</div>`;
 if(k==='type')return `<h3>What kind of statement is it?</h3><p>This sorts the sentence so you know how to check it. If you are unsure, pick the closer one: the verdict and your reason matter more than the label.</p><dl>
 <dt>Factual claim</dt><dd>The sentence states something that can be checked as <strong>true or false</strong>, using facts or numbers. Calling it a factual claim does not mean it is correct. Ask: <em>is this true or false here?</em>${eg(A?'"Total estimated cost: $140." You can add up the items and compare the total with the budget.':'"By the end of week 2 you should be able to score 80% on a practice test." It is presented as a fact about what will happen.')}</dd>
 <dt>Recommendation</dt><dd>The sentence suggests <strong>an action</strong>, something to do. Ask: <em>does this fit our situation?</em> A recommendation can be a good idea in general and still be wrong for this case.${eg(A?'"Seat people in small groups of four or five with conversation prompt cards."':'"Add a one-hour review every Saturday." Reasonable in general, but this learner does no weekend study.')}</dd></dl>`;
 if(k==='verdict')return `<h3>Choosing a verdict</h3><p>Compare the sentence with the <strong>fact card</strong> and the <strong>success criteria</strong>. Then give a short reason that points to your evidence. You do not have to find an error: a well-justified Supported is just as valuable.</p><dl>
 <dt><span class="pill Supported">Supported</span></dt><dd>It fits the facts and criteria, and you can point to the evidence.${eg(A?'"Small groups of four or five" is supported: the fact card says there are 20 adults with different confidence levels, which makes four groups of five.':'"Begin each session with 5 minutes reviewing errors" is supported: it fits a 30-minute session and is active practice.')}</dd>
 <dt><span class="pill Uncertain">Uncertain</span></dt><dd>You cannot decide yet because the information you need is not on the fact card. It might be fine, but something must be found out first.${eg(A?'"Serve morning tea with vegetarian and gluten-free options" is uncertain: food preferences have not been confirmed.':'"Score 80% by week 2" is uncertain: we do not know the learner\'s starting level or the test format.')}</dd>
 <dt><span class="pill Unsupported">Unsupported</span></dt><dd>It conflicts with the facts, or nothing justifies it.${eg(A?'"Total estimated cost: $140" is unsupported: the budget is $120.':'"Add a one-hour review every Saturday" is unsupported: the fact card says no weekend study.')}</dd></dl>
 <p class="note">A good reason names the evidence, for example: "The fact card gives a $120 budget, but these items add up to $140."</p>`;
 if(k==='trub')return `<h3>Evaluation criteria</h3><p>Rate each submission as <strong>Not evident</strong>, <strong>Partly</strong> or <strong>Clearly</strong>. Judge only what the submission shows; do not assume.</p><dl>
 <dt>Quality of the final product</dt><dd>Is the final answer, survey, paragraph or summary correct and fit for purpose?</dd>
 <dt>Evidence of the student's own judgement</dt><dd>Can you see decisions the student made, rather than output they accepted?</dd>
 <dt>Use of evidence to support decisions</dt><dd>Do their judgements point to the reading, the fact sheet, the rubric or the data?</dd>
 <dt>Transparency about how AI was used</dt><dd>Can you tell what the AI produced and what the student changed?</dd>
 <dt>Confidence that you know what the student understands</dt><dd>After reading it, how sure are you about what this student can do on their own?</dd></dl><div class="eg"><strong>Example:</strong> a polished Submission A can be <em>Clearly</em> on quality but <em>Not evident</em> on judgement, because nothing shows how it was produced.</div>`;
 if(k==='tadd'||k==='tcmp')return tuHelp(k);
 if(k.startsWith('c_')||k==='fixed')return critHelp(k);
 return `<h3>Accept, adapt or reject</h3><p>Feedback is a set of suggestions, not instructions. Decide what to do with each one, and give a reason based on the criteria or the fact card.</p><dl>
 <dt>Accept</dt><dd>Use the suggestion as it is, because it improves the work against the criteria.${eg(A?'"Add a time to each item": accept, because the draft does not show it fits 60 minutes.':'"Add a fractions refresher in week 1": accept, because the learner struggles with fractions.')}</dd>
 <dt>Adapt</dt><dd>The idea is useful, but it needs changing to fit the situation.${eg(A?'"Ask every person to present to the whole group": adapt, so each table chooses a reader or displays its poster, because confidence varies.':'"Take a full practice test every Friday": adapt to a short five-question check, because sessions are 30 minutes.')}</dd>
 <dt>Reject</dt><dd>Do not use it, because it conflicts with the facts or does not help.${eg(A?'"Hire a local musician": reject, because paid entertainment would strain the $120 budget.':'"Add a weekend catch-up session": reject, because the fact card says no weekend study.')}</dd></dl>
 <p class="note">Rejecting a suggestion with a good reason shows judgement. It is not a failure.</p>`;}

function tuHelp(k){const eg=t=>`<div class="eg">${t}</div>`;
 if(k==='tadd')return `<h3>Tutor instructions</h3><p>A simple question invites a complete answer. Each instruction changes how AI responds, so that you do more of the thinking. Tick one or more.</p><dl>
 <dt>Do not give me the final answer</dt><dd>The most important one: without it, most AI tools solve the problem for you.</dd>
 <dt>One hint at a time, then wait</dt><dd>Stops AI from giving every hint at once, which is the same as giving the answer.</dd>
 <dt>Start from my attempt</dt><dd>The help fits your thinking, and AI points to your actual mistake.${eg('<strong>Example:</strong> if you wrote "600 minutes is 6 hours", the tutor can ask how many minutes are in an hour.')}</dd>
 <dt>Explain only the next step if I am stuck</dt><dd>When hints are not enough, a short explanation keeps you moving without giving away the whole solution.</dd>
 <dt>Ask me to explain my method</dt><dd>Explaining in your own words shows whether you understand it, not just whether you got the number.</dd>
 <dt>Give me a similar problem</dt><dd>Checks that you can do it on your own, without the tutor.</dd>
 <dt>Keep each reply short</dt><dd>Short replies are easier to act on and leave the work to you.</dd></dl>`;
 return `<h3>Comparing the two approaches</h3><p>For each question, choose which approach did it better: the <strong>Direct answer</strong> from the simple prompt, or the <strong>Tutor</strong> conversation. <strong>About the same</strong> and <strong>Not sure</strong> are fair answers.</p><dl>
 <dt>Doing the thinking</dt><dd>Who worked out each step: you or the AI?</dd>
 <dt>Understanding the method</dt><dd>Could you now explain how to solve it, not just state the answer?</dd>
 <dt>Correct answer</dt><dd>Did each approach reach the right result? Both can.</dd>
 <dt>Speed</dt><dd>The direct answer is usually faster. That is a real advantage when you only need to check a result.</dd>
 <dt>A similar problem on your own</dt><dd>Which would leave you better prepared to solve the next one without AI?</dd></dl>
 ${eg('<strong>Example:</strong> "Tutor: the hint made me find my own mistake in turning minutes into hours, so I would not make it again."')}`;}
/* Sector-specific explanation for strategy 4 */
const SECTOR_ABOUT={
 education:{who:'Teacher education, or any course where students learn to explain ideas to others.',strategy:'Evaluate and improve (strategy 1): students check AI-written practice questions and worked answers.',why:'AI produces plausible practice questions quickly, but worked answers can contain errors or pitch the level wrongly. Finding and fixing them shows subject knowledge and an understanding of how learners think.',look:'Every worked answer has a verdict with a reference to the set reading, and the student can explain why one question could mislead a learner.'},
 business:{who:'Business, management or marketing courses that use cases and data collection.',strategy:'Feedback and revision (strategy 2): students accept, adapt or reject AI-drafted survey questions.',why:'AI can draft a customer survey in seconds, but questions often ask for data the business cannot collect or would not use. Deciding what to keep tests understanding of evidence and the business context.',look:'Each question has a decision linked to the fact sheet or budget, and the student can say what evidence a rejected question would have needed.'},
 writing:{who:'Any subject with written assessment: essays, reports, reflections or literature reviews.',strategy:'Feedback and revision (strategy 2): students judge AI feedback on a draft against the rubric.',why:'AI feedback is fast and fluent, but not every suggestion fits the rubric or the purpose of the piece. Accepting, adapting and rejecting with reasons shows the student understands the standard they are writing to.',look:'A decision log citing rubric criteria, a revision with visible changes, and the student applying one accepted suggestion to new writing in class.'},
 data:{who:'Data science, statistics, research methods or any course that reports results.',strategy:'Evaluate and improve (strategy 1): students check claims in an AI-written summary of results.',why:'AI summaries often lead with headline figures such as accuracy and miss what matters, such as a model that never finds the rare cases. Checking each claim against the numbers is a core professional skill.',look:'Every claim in the summary has a verdict with recomputed figures, and the student can explain without notes why accuracy alone can mislead.'},
 custom:{who:'Your own subject.',strategy:'Pick the strategy that fits: Evaluate and improve to check AI output, Feedback and revision to judge AI feedback, or AI as a tutor to learn a method with hints.',why:'Start from a task you already set. Ask where students are likely to use AI anyway, and make that use visible and checkable.',look:'The AI contribution is stated, every judgement needs evidence from your unit materials, and there is one moment where the student shows understanding without AI.'}
};
function assessSector(k){const x=SECTOR_ABOUT[k];if(!x)return '';const name=k==='custom'?'Custom':ASSESS_EX[k].label;
 return `<div class="soft" aria-live="polite" style="border-left:5px solid var(--orange)"><p style="margin:0 0 .4rem"><strong>${esc(name)}: how this example works</strong></p>
 <p style="margin:0 0 .4rem"><strong>Suits:</strong> ${esc(x.who)}</p>
 <p style="margin:0 0 .4rem"><strong>Strategy used:</strong> ${esc(x.strategy)}</p>
 <p style="margin:0 0 .4rem"><strong>Why it works:</strong> ${esc(x.why)}</p>
 <p style="margin:0"><strong>What good evidence looks like:</strong> ${esc(x.look)}</p>${k!=='custom'?'<p class="note" style="margin:.5rem 0 0">The sentence and brief below have been filled with this example. Edit them to fit your own unit.</p>':''}</div>`;}

 education:{label:'Education',strat:1,topic:'Calculating the mean (average) for adult learners returning to study',
  taskA:'Write three practice questions with worked answers on {topic}. Submit the questions and answers.',
  taskB:'Use AI to draft three practice questions with worked answers on {topic}. Then submit:\n1. Your prompt and the AI\'s draft.\n2. A check of each worked answer: Supported, Uncertain or Unsupported, with evidence from the set reading.\n3. Your corrected final set of questions.\n4. A short reflection (about 80 words) on what you changed and why.\n5. In class: explain one correction in two minutes, without notes.',
  A:`Q1. Find the mean of 4, 7 and 10.
Worked answer: 4 + 7 + 10 = 21, and 21 ÷ 3 = 7. The mean is 7.

Q2. A learner scores 12, 15, 9 and 14 on four quizzes. What is the mean score?
Worked answer: 12 + 15 + 9 + 14 = 50, and 50 ÷ 4 = 12.5. The mean score is 12.5.

Q3. The mean of five numbers is 6. Four of the numbers are 4, 5, 7 and 8. Find the fifth number.
Worked answer: 4 + 5 + 7 + 8 = 24, and 24 ÷ 4 = 6, so the fifth number is 6.`,
  B:[`Prompt: Write three practice questions with worked answers on calculating the mean, for adult learners returning to study. Include one question where a value is missing.

AI draft:
Q1. Find the mean of 4, 7 and 10. Worked answer: 4 + 7 + 10 = 21, and 21 ÷ 3 = 7.
Q2. Quiz scores of 12, 15, 9 and 14. Worked answer: 12 + 15 + 9 + 14 = 50, and 50 ÷ 4 = 12.5.
Q3. The mean of five numbers is 6. Four of them are 4, 5, 7 and 8. Find the fifth. Worked answer: 4 + 5 + 7 + 8 = 24, and 24 ÷ 4 = 6, so the fifth number is 6.`,
`Q1 worked answer: Supported. The sum is 21 and there are 3 values, so 21 ÷ 3 = 7. This matches the definition in the reading: sum ÷ number of values.
Q2 worked answer: Supported. I re-added the scores (50) and divided by 4 to get 12.5.
Q2 level: Uncertain. The answer is a decimal. The reading says some learners find fractions and decimals hard, so this may need a hint.
Q3 worked answer: Unsupported. The answer 6 is right only by coincidence: averaging the four known numbers is the wrong method. The correct method is total = 5 × 6 = 30, then 30 − 24 = 6. With 2, 5, 7 and 8 the AI's method gives 5.5, but the correct answer is 8.`,
`Q1. Find the mean of 4, 7 and 10.
Worked answer: 4 + 7 + 10 = 21, and 21 ÷ 3 = 7.

Q2. Quiz scores of 12, 15, 9 and 14. Find the mean.
Worked answer: 12 + 15 + 9 + 14 = 50, and 50 ÷ 4 = 12.5. Hint: 50 ÷ 4 is 12 with 2 left over, and 2 out of 4 is a half.

Q3. The mean of five numbers is 6. Four of them are 2, 5, 7 and 8. Find the fifth.
Worked answer: all five numbers add to 5 × 6 = 30. The four known numbers add to 22. The fifth number is 30 − 22 = 8.`,
`The AI's third question got the right number by accident: it averaged the four known numbers. I only noticed because I checked the method, not just the answer. I changed the numbers so the wrong method gives a different answer, which makes the question a fairer test, and I added a hint for the decimal in Q2. Next time I would ask the AI to name the formula it uses in each step.`,
`If the mean of five numbers is 6, all five must add up to 30. Take away the four numbers you know, which add to 22, and the missing number is 8. Averaging the four known numbers gives 5.5, which is not the missing number at all.`],
  evalA:'The questions look correct and well set out, but I cannot tell whether the student wrote or checked them. Q3 uses a wrong method that happens to give the right answer, and nothing shows the student noticed. I can grade the product but not the learning.',
  evalB:'The final set is correct, and the student found the flawed method in Q3, explained why it is wrong and changed the numbers so the question now tests the right idea. Each verdict points to the reading. I can see what they understand, and the in-class explanation confirms it.'},
 business:{label:'Business',strat:2,topic:'A short customer survey for a café trial to reduce unsold sandwiches',

  taskB:'Write your own five-question draft for {topic}. Ask AI for feedback using the café fact sheet (short survey, no personal data, the owner tallies results by hand). Then submit:\n1. Your draft and the AI\'s feedback.\n2. A decision log: accept, adapt or reject each suggestion, with a reason.\n3. Your revised survey.\n4. A short reflection (about 80 words).\n5. In class: explain one rejected suggestion in two minutes.',
  A:`Café customer survey
1. How satisfied are you with our sandwiches? (1 to 5)

  B:[`My draft:

`1. Answer options for Q1 and Q2: Accept. The owner tallies by hand, so fixed options are faster.
2. Age and income: Reject. The fact sheet says no personal data, and they are not needed for this trial.
3. Follow-up to Q3: Adapt. Useful, but I made it tick boxes (bought something else / left without buying) to keep the survey quick.

`1. How often do you buy a sandwich here? (Daily / 2 to 3 times a week / Weekly / Less often)

`I accepted the time bands because the owner needs answers that are quick to tally. I rejected age and income: they are personal, not needed and would make the survey longer. The AI's idea about sold-out sandwiches was the most useful, but I simplified it to tick boxes. The feedback was fluent, but two of the four suggestions did not fit the café's goal.`,
`I rejected the new-fillings question because the trial aims to reduce waste. Asking customers for more fillings would push the owner to make more types of sandwich, which could increase the number left unsold.`],

 writing:{label:'Writing',strat:2,topic:'Should the campus library stay open until midnight during exam weeks?',
  taskA:'Write a persuasive paragraph of about 120 words on: {topic} Submit the paragraph.',
  taskB:'Write your own draft paragraph (about 120 words) on: {topic} Ask AI for feedback against the rubric: a clear claim, relevant evidence, a counter-argument and a conclusion. Then submit:\n1. Your draft and the AI\'s feedback.\n2. A decision log: accept, adapt or reject each suggestion, with a reason.\n3. Your revised paragraph.\n4. A short reflection (about 80 words).\n5. In class: revise a new sentence using one accepted suggestion.',
  A:`The campus library should stay open until midnight during exam weeks. Studies show that 78% of students study best late at night, and extended hours would reduce stress across the university. A quiet, well-lit space gives students who share crowded homes a place to focus, and longer hours spread demand so the library is less crowded at peak times. While some may worry about staffing costs, the benefits for student success clearly outweigh them. Extending opening hours is a simple, low-cost way to show that the university supports its students when it matters most.`,
  B:[`My draft:
I think the library should stay open until midnight in exam weeks. Many students work or care for family during the day, so evenings are the only time they can study. At home it can be noisy. The library has computers and quiet rooms. Some people say it costs too much. But it is only for a few weeks a year.

AI feedback:
1. Open with a clearer claim: remove "I think" and state your position directly.
2. Strengthen your evidence with a statistic, such as "78% of students study best at night".
3. Develop the counter-argument: explain the staffing cost and how it could be reduced.
4. Add a concluding sentence that returns to your claim.`,
`1. Clearer claim: Accept. The rubric asks for a clear claim, and "I think" weakens it.
2. Add a statistic: Reject. The AI gave no source for 78%, so I cannot use it. I would use a source from the reading or local data such as library entry counts.
3. Counter-argument: Adapt. I acknowledged the cost and proposed a trial, without inventing figures.
4. Concluding sentence: Accept. The rubric asks for a conclusion and my draft stopped abruptly.`,
`The campus library should stay open until midnight during exam weeks. Many students work or care for family during the day, so the evening is their only real study time, and home can be noisy. The library offers quiet rooms and computers that some students do not have elsewhere. Extra hours cost money for staff, but the university could trial late opening for exam weeks only, with fewer services after 10 pm, and use entry counts to see whether students come. A short trial would show whether late opening is worth keeping, and it would support students when they need it most.`,
`The most important decision was rejecting the 78% statistic. It sounded convincing, but there was no source, and using it would have been dishonest. Developing the counter-argument made my paragraph stronger than simply dismissing the cost. My paragraph is less polished than an AI version, but every claim in it is one I can defend.`,
`Original sentence: "Libraries are good for students." Revised using the clear-claim suggestion: "Late opening in exam weeks gives students without a quiet home a place to study."`],
  evalA:'Fluent and persuasive, but it relies on a statistic with no source and contradicts itself by calling the change low-cost while admitting staffing costs. I cannot tell how much of the writing or judgement is the student\'s own.',
  evalB:'The student\'s draft, the AI feedback and their decisions are all visible. They rejected the invented statistic, developed the counter-argument into a realistic trial, and the revision meets the rubric. The prose is less polished than A, but the reasoning is clearly theirs.'},
 data:{label:'Data analysis',strat:1,topic:'A model that predicts late deliveries (fictional data: 100 orders, 8 late; the model predicts every order on time)',

  A:`The model performs very well, with an accuracy of 92%. It correctly classified 92 of 100 orders and produced no false alarms, so staff would never be sent to chase an order that was actually on time. With such high accuracy, the model is ready to be used to flag late deliveries. Further gains could come from adding more data.`,
  B:[`Prompt: Summarise this model's performance for a manager in about 80 words. Results: 100 orders, 8 actually late. The model predicted all 100 orders as on time.

AI summary:
The model performs very well, with an accuracy of 92%. It correctly classified 92 of 100 orders and produced no false alarms, so staff would never be sent to chase an order that was actually on time. With such high accuracy, the model is ready to be used to flag late deliveries.`,
`"Accuracy of 92%": Supported. (0 + 92) ÷ 100 = 92%.
"No false alarms": Supported, but misleading. No on-time order was flagged as late, because nothing was flagged at all.
"Performs very well": Unsupported. It found 0 of the 8 late orders (0%).
"Ready to be used to flag late deliveries": Unsupported. It flags nothing. A rule that always says "on time" also scores 92%.`,
`The model labels every order as on time. It is 92% accurate only because 92 of the 100 orders were on time; it found none of the 8 late orders. A rule that always says "on time" would score the same. The model is not yet useful for flagging late deliveries. It should be retrained and judged on how many late orders it finds, not on accuracy alone.`,
`The AI summary sounded confident, and every number in it was technically correct, which is what made it misleading. Checking each claim against the table showed that the model never finds a late order. I now look at the cases that matter, not just the headline accuracy, before I believe a summary.`,
`Accuracy counts all the correct predictions. When late orders are rare, saying "on time" for every order is right 92% of the time, but it finds no late orders. To judge the model you need to look at how many late orders it actually caught.`],

/* ---------- Files: PDF summaries and downloads ---------- */
function pdfBtn(){return `<div class="row" style="margin-top:1rem"><button type="button" class="btn primary" data-do="pdfLearn">Download a PDF of this summary</button><span class="note">Includes your reflection. Keep it for your notes or portfolio.</span></div>`;}
/* Save a file: through the claude.ai viewer when published, otherwise as a normal browser download */
async function saveFile(filename,data,mime){let dl=null;try{if(window.claude&&typeof window.claude.use==='function')dl=await window.claude.use('downloads');}catch(e){dl=null;}
 if(dl){try{await dl.save({filename,data});toast('Saved '+filename+'.');}catch(e){toast(e&&e.code==='declined'?'Download cancelled.':'The file could not be saved here. Try Print instead.');}return;}
 const blob=data instanceof Blob?data:new Blob([data],{type:mime||'application/octet-stream'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);toast('Downloaded '+filename+'.');}
/* jsPDF's built-in fonts cover Latin-1 only, so swap other characters for plain ones */
const pdfSafe=t=>String(t||'').replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/[\u2013\u2014\u2212]/g,'-').replace(/\u2192/g,'->').replace(/\u2026/g,'...').replace(/\u2022/g,'-').replace(/[^\x09\x0A\x0D\x20-\x7E\u00A0-\u00FF]/g,'');
function buildPdf(title,sections,who){const J=window.jspdf&&window.jspdf.jsPDF;if(!J)return null;const doc=new J({unit:'mm',format:'a4'});const W=210,M=18,TW=W-2*M;let y;
 const need=h=>{if(y+h>282){doc.addPage();y=20;}};
 doc.setFillColor(11,58,111);doc.rect(0,0,W,14,'F');doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.text('From AI Users to Critical Thinkers  |  VU Digital Community of Practice, 20 November 2026',M,9);
 y=27;doc.setTextColor(11,58,111);doc.setFontSize(17);doc.splitTextToSize(pdfSafe(title),TW).forEach(l=>{need(8);doc.text(l,M,y);y+=7.5;});
 doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(95,105,115);doc.text(pdfSafe('Generated '+new Date().toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'})+'. Prepared examples are labelled in the app; this summary records your choices, not a mark.'),M,y);y+=6;
 const whoLine=who?[who.name,who.aff,who.email].filter(has).map(x=>x.trim()).join('  |  '):'';
 if(whoLine){doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.setTextColor(30,38,51);doc.splitTextToSize(pdfSafe('Prepared by: '+whoLine),TW).forEach(l=>{doc.text(l,M,y);y+=5.2;});doc.setFont('helvetica','normal');}
 y+=3;
 doc.setDrawColor(201,214,229);doc.line(M,y-4,W-M,y-4);
 sections.forEach(([h,b])=>{need(14);doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(11,58,111);doc.splitTextToSize(pdfSafe(h),TW).forEach(l=>{need(6);doc.text(l,M,y);y+=6;});
  doc.setFont('helvetica','normal');doc.setFontSize(10.5);doc.setTextColor(30,38,51);
  pdfSafe(b).trim().split('\n').forEach(par=>{if(!par.trim()){y+=2;return;}doc.splitTextToSize(par.trim(),TW).forEach(l=>{need(5.2);doc.text(l,M,y);y+=5.2;});});y+=5;});
 const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(120,120,120);doc.text('Page '+i+' of '+n,W-M,291,{align:'right'});}
 return doc.output('blob');}
/* Optional details for the PDF. Kept in memory for this visit only: never saved or sent anywhere */
let pdfWho={name:'',aff:'',email:''};
function askDetails(){return new Promise(res=>{const back=document.activeElement;const o=document.createElement('div');o.className='modalbg';
 o.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="pdfWhoH"><h3 id="pdfWhoH" style="margin-top:0">Add your details to the PDF?</h3><p class="note">All optional. Leave any box empty. Your details are only printed on this PDF; they are not saved or sent anywhere.</p>
 <label class="lbl" for="pwName">Name</label><input type="text" id="pwName" autocomplete="name" placeholder="e.g., Alex Nguyen" value="${esc(pdfWho.name)}">
 <label class="lbl" for="pwAff">Affiliation</label><input type="text" id="pwAff" autocomplete="organization" placeholder="e.g., Victoria University, College of Arts, Business, Law, Education and IT" value="${esc(pdfWho.aff)}">
 <label class="lbl" for="pwEmail">Email</label><input type="text" id="pwEmail" autocomplete="email" inputmode="email" placeholder="e.g., alex.nguyen@vu.edu.au" value="${esc(pdfWho.email)}">
 <div class="row" style="justify-content:flex-end;margin-top:1rem"><button type="button" class="btn ghost" data-r="cancel">Cancel</button><button type="button" class="btn" data-r="skip">Skip and download</button><button type="button" class="btn primary" data-r="add">Add and download</button></div></div>`;
 const done=v=>{o.remove();document.removeEventListener('keydown',key,true);if(back&&back.focus)back.focus({preventScroll:true});res(v);};
 const key=e=>{if(e.key==='Escape'){e.preventDefault();done(null);}if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();o.querySelector('[data-r="add"]').click();}if(e.key==='Tab'){const f=[...o.querySelectorAll('input,button')];const i=f.indexOf(document.activeElement);if(e.shiftKey&&i===0){e.preventDefault();f[f.length-1].focus();}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus();}}};
 o.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b)return;const r=b.dataset.r;if(r==='cancel')return done(null);if(r==='skip')return done({name:'',aff:'',email:''});pdfWho={name:$('#pwName').value,aff:$('#pwAff').value,email:$('#pwEmail').value};done(pdfWho);});
 document.addEventListener('keydown',key,true);document.body.appendChild(o);$('#pwName').focus();});}
async function deliverPdf(title,secs){const who=await askDetails();if(!who){toast('PDF cancelled.');return;}const blob=buildPdf(title,secs,who);const name='working-better-with-ai-'+title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)+'.pdf';
 if(blob){await saveFile(name,blob,'application/pdf');return;}
 $('#printArea').innerHTML=`<h1>${esc(title)}</h1>`+([who.name,who.aff,who.email].some(has)?`<p><strong>Prepared by:</strong> ${esc([who.name,who.aff,who.email].filter(has).join(' | '))}</p>`:'')+secs.map(([h,b])=>`<h2>${esc(h)}</h2><div class="pre">${esc(b)}</div>`).join('');toast('The PDF tool is not available offline. Choose Save as PDF in the print window.');setTimeout(()=>window.print(),300);}
/* ---------- Render ---------- */
const VIEWS={home:renderStart,eval:renderEval,fb:renderFb,tutor:renderTutor,assess:renderAssess,take:renderTake};
function render(focusHead){const act=document.activeElement&&document.activeElement.id;
 if(!VIEWS[state.tab])state.tab='home';$('#main').innerHTML=VIEWS[state.tab]();
 autoGrow();if(focusHead){const v=$('#main .view');if(v)v.classList.add('fade');const h=$('#pageH');if(h)h.focus({preventScroll:true});window.scrollTo({top:0});}
 else if(act){const el=document.getElementById(act);if(el)el.focus({preventScroll:true});}}
function autoGrow(el){(el?[el]:document.querySelectorAll('#main textarea')).forEach(t=>{t.style.height='auto';if(t.tagName!=='TEXTAREA')return;t.style.height=(t.scrollHeight+3)+'px';});}
function gateMsg(m){const g=$('#gateMsg');if(g){g.innerHTML=m?`<p class="err">${esc(m)}</p>`:'';}}

/* ---------- Step navigation with gentle checks ---------- */
function evGate(s,st){const e=state.ev[s];
 if(st===0&&!has(e.initResp))return 'Add an initial AI response first: use the prepared example, paste one, or write one.';
 if(st===1){ensureUnits(e);if(e.unitsFrom!==e.initResp&&has(e.initResp))return 'The response has changed. Divide it again before continuing.';if(!e.units.some(u=>u.sel))return 'Tick at least one sentence to check. You can choose as many as you like.';}
 if(st===2){const i=e.units.findIndex(u=>u.sel&&!(has(u.text)&&u.verdict));if(i>=0)return `Sentence ${i+1} needs a verdict.`;}
 if(st===3){if(!has(e.prompt)||e.prompt.trim()===SCEN[s].initialPrompt.trim())return 'Add at least one improvement to the prompt: tick a box above or fill in a field.';if(!has(e.revResp))return 'Add a revised AI response so you can compare.';}
 return '';}
function fbGate(s,st){const f=state.fb[s];
 if(st===0&&!has(f.draft))return 'Add a draft first: use the prepared example or write your own.';
 if(st===1&&!has(f.feedback))return 'Add feedback first: use the prepared example, paste feedback or write your own.';
 if(st===2){ensureDec(f);const i=f.dec.findIndex(d=>has(d.sug)&&!d.decision);if(i>=0)return `Suggestion ${i+1} needs a decision: Accept, Adapt or Reject.`;if(!f.dec.some(d=>has(d.sug)&&d.decision))return 'Make a decision on at least one suggestion.';}
 if(st===3){if(!has(f.revision))return 'Write your revision first.';if(f.revision.trim()===f.draft.trim())return 'Your revision is identical to the draft. Make the changes you decided on.';}
 return '';}
function go(kind,n){const s=state.scen,o=kind==='ev'?state.ev[s]:kind==='tu'?state.tu[state.tuSel]:kind==='tp'?state.as.tp:state.fb[s],gate=kind==='ev'?evGate:kind==='tu'?tuGate:kind==='tp'?tpGate:fbGate,last=kind==='ev'?5:kind==='tp'?6:4;
 if(n>o.step){for(let i=o.step;i<n;i++){const m=gate(s,i);if(m){if(o.step!==i){o.step=i;render(true);}gateMsg(m);const g=$('#gateMsg');if(g)g.scrollIntoView({block:'center'});return;}}}
 o.step=n;if(n===last)o.done=true;save();render(true);}

/* ---------- Copy ---------- */
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copied. Paste it into your AI tool.');}catch(e){const x=document.createElement('textarea');x.value=t;x.setAttribute('readonly','');x.style.position='fixed';x.style.opacity='0';document.body.appendChild(x);x.select();let ok=false;try{ok=document.execCommand('copy');}catch(_){}x.remove();toast(ok?'Copied. Paste it into your AI tool.':'Copy was blocked. Select the text and copy it manually.');}}

/* ---------- Change handlers ---------- */
function onMode(el){const mk=el.dataset.k,tk=el.dataset.target,prep=PREP[el.dataset.prep](state.scen),toolK=el.dataset.tool,cur=get(tk)||'',prev=get(mk);
 if(!state.stash)state.stash={};
 /* keep the participant's own text so that switching options never loses it */
 if(prev!=='prepared'&&has(cur)&&cur!==prep)state.stash[tk]=cur;
 if(el.value==='prepared'){set(tk,prep);if(toolK)set(toolK,'Prepared example');}
 else if(el.value==='fromDraft'){set(tk,state.fb[state.scen].draft);}
 else{set(tk,(prev==='prepared'||prev==='fromDraft')?(state.stash[tk]||''):cur);if(toolK&&get(toolK)==='Prepared example')set(toolK,'');}
 set(mk,el.value);save();render();
 if(el.value==='prepared'&&state.stash[tk])toast('Your own text is kept. Switch back to get it again.');
 else if(prev==='prepared'&&state.stash[tk])toast('Your earlier text has been restored.');}
/* The improved prompt starts from the initial prompt; ticked boxes and filled fields are added below it */
function fullPrompt(s){const add=assemble(state.ev[s].b);return SCEN[s].initialPrompt+(has(add)?'\n\nUse the following details:\n\n'+add:'');}
function updPromptDiff(s){const d=document.getElementById('promptDiff');if(!d)return;const e=state.ev[s],ip=SCEN[s].initialPrompt;d.innerHTML=has(e.prompt)&&e.prompt.trim()!==ip.trim()?diffHTML(ip,e.prompt):'<em>Nothing added yet. Tick a box or fill in a field.</em>';}
function rebuild(s){const e=state.ev[s];e.prompt=fullPrompt(s);e.promptEdited=false;}
async function afterBuilder(s){const e=state.ev[s];if(!e.promptEdited||!has(e.prompt))rebuild(s);else if(await askConfirm('You have edited the full prompt by hand. Rebuild it from the fields to include this change? Your hand edits will be replaced.'))rebuild(s);setTimeout(()=>{flash([`ev.${s}.prompt`]);updPromptDiff(s);},0);}

async function toggleLine(el,key,line){const s=state.scen,e=state.ev[s];let lines=e.b.missing.split('\n').filter(x=>x.trim()!==line&&x.trim()!=='');if(el.checked)lines.push(line);e.b.missing=lines.join('\n');e.chk[key]=el.checked;await afterBuilder(s);save();render();}
async function onPick(el){const s=state.scen,i=+el.dataset.pick,d=state.fb[s].dec[i];if(el.value==='')return;const t=SCEN[s].fb.suggestions[+el.value].text;
 if(has(d.sug)&&d.sug!==t&&!await askConfirm('Replace the suggestion text in this card?')){render();return;}if(d.sug!==t){d.sug=t;d.ex=false;}save();render();}
async function onAssessEx(el){const a=state.as;if(el.value==='custom'){a.ex='custom';save();render();return;}
 const x=ASSESS_EX[el.value],keys=['s1','s2','s3','s4','task','ai','verify','evidence','demo'];
 const own=keys.some(k=>has(a[k])&&!Object.values(ASSESS_EX).some(y=>y[k]===a[k]));
 if(own&&!await askConfirm(`Replace your sentence and brief with the ${x.label.toLowerCase()} example?`)){render();return;}
 keys.forEach(k=>a[k]=x[k]);a.ex=el.value;save();render();}

const main=$('#main');
main.addEventListener('change',e=>{const el=e.target;
 if(el.id==='saveChk'){state.save=el.checked;if(el.checked){try{localStorage.setItem(KEY,JSON.stringify(state));toast('Saving in this browser.');}catch(_){storageOK=false;state.save=false;render();}}else{try{localStorage.removeItem(KEY);}catch(_){}toast('Saving stopped and the saved copy removed.');}return;}
 if(el.dataset.mode)return onMode(el);

 if(el.dataset.pick!==undefined)return onPick(el);
 if(el.dataset.act)return ACT[el.dataset.act](el);
 if(el.dataset.norender){set(el.dataset.k,el.checked);const e=state.ev[state.scen],n=e.units.filter(u=>u.sel).length,c=$('#selCount');if(c)c.textContent=`${n} sentence${n===1?'':'s'} selected out of ${e.units.length}.`;save();return;}
 if(el.dataset.k&&(el.type==='radio'||el.type==='checkbox'||el.tagName==='SELECT')){set(el.dataset.k,el.type==='checkbox'?el.checked:el.value);save();render();}});
main.addEventListener('input',e=>{const el=e.target,k=el.dataset.k;if(!k||!(el.tagName==='TEXTAREA'||el.type==='text'))return;set(k,el.value);autoGrow(el);
 let m;
 if((m=k.match(/^ev\.([A-D])\.b\./))){const ev=state.ev[m[1]];if(!ev.promptEdited){rebuild(m[1]);const p=document.getElementById(fid(`ev.${m[1]}.prompt`));if(p){p.value=ev.prompt;autoGrow(p);}}enableEx(ev);updPromptDiff(m[1]);}
 if((m=k.match(/^ev\.([A-D])\.prompt$/))){state.ev[m[1]].promptEdited=true;enableEx(state.ev[m[1]]);updPromptDiff(m[1]);}
 if(/^fb\.[A-D]\.revision$/.test(k)){const f=state.fb[state.scen],d=$('#diffView');if(d)d.innerHTML=has(f.revision)?diffHTML(f.draft,f.revision):'<em>No revision yet.</em>';}
 if(k.startsWith('as.')){const fo=$('#frameOut');if(fo)fo.innerHTML=frame();const bo=$('#briefOut');if(bo)bo.textContent=briefText();const db=$('#dataBtn');if(db)db.disabled=!has(state.as.dataAns);}
 if((m=k.match(/^tu\.(t\d)\.attempt$/))){const u=state.tu[m[1]];if(!u.promptEdited){tuRebuild(m[1]);const p=document.getElementById(fid(`tu.${m[1]}.prompt`));if(p){p.value=u.prompt;autoGrow(p);}}tuDiffUpd(m[1]);}
 if((m=k.match(/^tu\.(t\d)\.prompt$/))){state.tu[m[1]].promptEdited=true;tuDiffUpd(m[1]);}
 if(/^as\.tp\.d\.\w+\.taskB$/.test(k))tpS().taskBEdited=true;
 const st=$('#sumText');if(st)st.textContent=notesText();
 save();});
function enableEx(ev){const b=$('#showExBtn'),n=$('#showExNote'),ok=has(ev.prompt)&&ev.prompt.trim()!==SCEN[state.scen].initialPrompt.trim();if(b)b.disabled=!ok;if(n&&ok)n.remove();}

const DO={
 tab(b){state.tab=b.dataset.t;save();render(true);},
 pick(b){state[b.dataset.k]=b.dataset.v;save();render();},
 evStep(b){go('ev',+b.dataset.n);}, fbStep(b){go('fb',+b.dataset.n);},
 copy(b){const el=document.getElementById(b.dataset.from);if(!el)return;const t=el.value!==undefined&&el.tagName==='TEXTAREA'?el.value:el.textContent;if(!has(t)){toast('There is nothing to copy yet.');return;}copyText(t);},
 async rebuild(){const s=state.scen,e=state.ev[s],t=assemble(e.b);if(!has(t)){toast('The fields are empty. Fill in at least one field, or tick a box above, first.');return;}if(e.prompt===fullPrompt(s)){e.promptEdited=false;flash([`ev.${s}.prompt`]);toast('Your prompt already matches the fields.');return;}if(e.promptEdited&&has(e.prompt)&&!await askConfirm('Replace your edited prompt with one rebuilt from the fields?'))return;rebuild(s);save();render();flash([`ev.${s}.prompt`]);toast('Prompt rebuilt from the fields.');},
 async suggest(){const s=state.scen,e=state.ev[s],S=SCEN[s],names={goal:'goal',audience:'audience',output:'requested output'},added=[];['goal','audience','output'].forEach(k=>{if(!has(e.b[k])){e.b[k]=S[k];added.push(k);}});if(!added.length){flash([`ev.${s}.b.goal`,`ev.${s}.b.audience`,`ev.${s}.b.output`]);toast('Goal, audience and requested output already have text, so nothing changed. Clear a box to get a suggestion.');return;}await afterBuilder(s);save();render();flash(added.map(k=>`ev.${s}.b.${k}`).concat(`ev.${s}.prompt`));toast('Suggested wording added to '+added.map(k=>names[k]).join(', ')+'. Your prompt has been updated.');},
 showEx(){state.ev[state.scen].showEx=true;save();render();},
 async useEx(){const s=state.scen,e=state.ev[s],p=SCEN[s].improvedPrompt;if(has(e.prompt)&&e.prompt!==p&&!await askConfirm('Replace your improved prompt with the example? Your prompt fields stay as they are.'))return;e.prompt=p;e.promptEdited=true;save();render();},
 async prepSel(){const s=state.scen,e=state.ev[s];if(e.units.some(u=>u.sel&&(u.verdict||has(u.reason)))&&!await askConfirm('Replace your ticks with the prepared example selections? Sentences you untick keep their verdicts in case you tick them again.'))return;const used=new Set();e.units.forEach(u=>{const pc=prepClaimFor(s,u.text);u.sel=!!pc&&!used.has(pc);if(u.sel)used.add(pc);});save();render();},
 async resplit(){const e=state.ev[state.scen];if(e.units.some(u=>u.sel||u.verdict||has(u.reason))&&!await askConfirm('Divide the response again? Your ticks, verdicts and reasons for this response will be cleared.'))return;e.units=[];e.unitsFrom=null;ensureUnits(e);save();render();},
 help(b){showHelp(b.dataset.h);},
 async draftFixed(){const s=state.scen,e=state.ev[s],F=findingsOf(e);const prepRev=e.revMode==='prepared'&&e.revResp===SCEN[s].improvedResponse;const L=[];
  if(!F.length)L.push('I did not mark any sentence Unsupported or Uncertain, so there were no problems to fix.','[Say whether the revised response still fits the facts.]');
  F.forEach((u,i)=>{L.push(`${i+1}. "${trimDot(u.text)}" I judged this ${u.verdict.toLowerCase()}${has(u.reason)?': '+brief(u.reason):''}.`);L.push('   '+((prepRev&&outcomeFor(s,u.text))||'[Fixed / Partly fixed / Not fixed]: [point to the line in the revised response that shows this]'));});
  L.push('',prepRev?STILL[s]:'Still to check: [anything the revised response still assumes or leaves out]');const t=L.join('\n');
  if(has(e.fixed)&&e.fixed!==t&&!await askConfirm('Replace your answer with a new draft built from your verdicts?'))return;
  e.fixed=t;e.fixedDraft=prepRev?'prep':'own';save();render();toast('Draft ready. Check it and edit it.');},
 addSug(){const f=state.fb[state.scen];ensureDec(f);const next=f.sugList.find(t=>!f.dec.some(d=>d.sug.trim()===t.trim()))||'';f.dec.push(blankDec(next));save();render();const el=document.getElementById(fid(`fb.${state.scen}.dec.${f.dec.length-1}.sug`));if(el){el.focus();el.scrollIntoView({block:'center'});}toast(next?'Suggestion added from the feedback.':'New box added. Paste a suggestion from the feedback.');},
 async delSug(b){const f=state.fb[state.scen],i=+b.dataset.i,d=f.dec[i];if((has(d.sug)||d.decision)&&!await askConfirm('Remove this suggestion and your decision about it?'))return;f.dec.splice(i,1);save();render();},
 async resplitSug(){const f=state.fb[state.scen];if(f.dec.some(d=>d.decision||has(d.reason))&&!await askConfirm('Divide the feedback again? Your decisions and reasons in this step will be cleared.'))return;f.dec=[];f.sugFrom=null;ensureDec(f);save();render();toast(f.sugList.length?`${f.sugList.length} suggestion${f.sugList.length===1?'':'s'} found in the feedback.`:'No separate suggestions found. Copy them in from the feedback.');},
 clearSel(){const e=state.ev[state.scen];e.units.forEach(u=>u.sel=false);save();render();},
 async randomSel(){const e=state.ev[state.scen];if(!e.units.length){toast('There are no sentences yet.');return;}if(e.units.some(u=>u.sel&&(u.verdict||has(u.reason)))&&!await askConfirm('Choose a new random set? Sentences you untick keep their verdicts in case you tick them again.'))return;pickRandom(e.units,5);save();render();toast(e.units.length>5?'5 new sentences chosen at random.':'All sentences are ticked.');},
 selAll(){const e=state.ev[state.scen];if(!e.units.length){toast('There are no sentences to tick yet.');return;}e.units.forEach(u=>u.sel=true);save();render();toast('All sentences ticked. Untick any that do not matter.');},
 addUnit(){const i=$('#addUnit'),t=i&&i.value.trim();if(!t){toast('Type or paste a sentence first.');return;}state.ev[state.scen].units.push({text:t,sel:true,type:'',verdict:'',reason:'',ex:false});save();render();toast('Sentence added and ticked.');},
 pickTask(b){state.tuSel=b.dataset.v;save();render();},
 tuStep(b){go('tu',+b.dataset.n);},
 tpStep(b){go('tp',+b.dataset.n);{const h=$("#tpH");if(h){h.scrollIntoView({block:"start"});h.focus({preventScroll:true});}}},
 async tpResetB(){const t=state.as.tp,X=TP_SECTORS[t.sec],d=tpS(),orig=tpTask(X.taskB,d);if(d.taskB===orig){toast('The task already has the original wording.');return;}if(!await askConfirm('Restore the original wording of version B? Your edits will be replaced.'))return;d.taskB=orig;d.taskBEdited=false;save();render();flash(['as.tp.d.'+t.sec+'.taskB']);toast('Original wording restored.');},
 async tpLoadAll(){const t=state.as.tp,X=TP_SECTORS[t.sec],d=tpS();if(d.b.some((x,i)=>has(x.text)&&x.text!==X.B[i])&&!await askConfirm('Replace your responses with the example student responses?'))return;d.b.forEach((x,i)=>{x.mode='prepared';x.text=X.B[i];});save();render();const h=$('#tpH');if(h)h.scrollIntoView({block:'start'});toast('Example responses loaded for all five parts.');},
 async loadTuAttempt(){const k=state.tuSel,u=state.tu[k],t=TUTOR[k].attemptEx;if(has(u.attempt)&&u.attempt!==t&&!await askConfirm('Replace your attempt with the example attempt?'))return;u.attempt=t;if(!u.promptEdited)tuRebuild(k);save();render();flash([`tu.${k}.prompt`]);toast('Example attempt loaded. It contains a typical mistake.');},
 async loadTuReply(b){const k=state.tuSel,r=+b.dataset.r,R=state.tu[k].rounds[r],t=TUTOR[k].rounds[r].me;if(has(R.me)&&R.me!==t&&!await askConfirm('Replace your reply with the example reply?'))return;R.me=t;save();render();},
 sendTu(b){const k=state.tuSel,r=+b.dataset.r,R=state.tu[k].rounds[r],m=$('#tuMsg');if(!has(R.ai)){m.innerHTML=`<p class="err">Add tutor reply ${r+1} first.</p>`;return;}if(!has(R.me)){m.innerHTML=`<p class="err">Write your reply ${r+1} first, with your own working.</p>`;return;}R.sent=true;save();render();const nx=document.getElementById(fid(`tu.${k}.rounds.${r+1}.aMode`)+'_'+(TUTOR[k].rounds[r+1]?'prepared':'paste'));if(nx){nx.scrollIntoView({block:'center'});nx.focus({preventScroll:true});}toast(`Round ${r+2} is ready.`);},
 addTuRound(){const u=state.tu[state.tuSel];u.rounds.forEach(R=>R.sent=true);u.rounds.push({aMode:'paste',ai:'',me:'',sent:false});save();render();toast('New round added. Paste the next tutor reply.');},
 showData(){state.as.showData=true;save();render();},
 download(){saveFile('working-better-with-ai-notes.txt',notesText(),'text/plain;charset=utf-8');},
 async pdfLearn(b){const L=b.closest('.learn');if(!L)return;const i=STRATS.findIndex(x=>x.id===state.tab);const inTp=!!b.closest('#tpPanel');
  const head=(i>=0?`Strategy ${i+1}: ${STRATS[i].name}${inTp?', practice':''}. `:'')+L.querySelector('h3').textContent;
  const secs=[];L.querySelectorAll('dt').forEach(dt=>{const dd=dt.nextElementSibling;secs.push([dt.textContent,dd?dd.innerText.replace(/\n{2,}/g,'\n'):''])});
  await deliverPdf(head,secs);},
 async pdfNotes(){const secs=[];let cur=null;notesText().split('\n').slice(2).forEach(l=>{const m=l.match(/^== (.*) ==$/);if(m){if(cur)secs.push(cur);cur=[m[1],''];}else if(cur)cur[1]+=l+'\n';});if(cur)secs.push(cur);const t=state.tk;const tk=[['One idea I will try',t.one],['One risk I will watch for',t.two],['One question I still have',t.three]].filter(([,v])=>has(v));
  if(!secs.length&&!tk.length){toast('There is nothing to put in the PDF yet.');return;}
  await deliverPdf('My notes and reflections',secs.filter(([h])=>h!=='Takeaways').concat(tk.length?[['My takeaways',tk.map(([l,v])=>l+': '+v.trim()).join('\n')]]:[]));},

 async reset(){if(!await askConfirm('Reset clears every entry in every activity on this page. This cannot be undone. Reset now?'))return;state=blankState();try{localStorage.removeItem(KEY);}catch(_){}render(true);toast('Everything has been reset.');}
};
